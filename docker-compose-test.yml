services:
  postgres_test:
    image: postgres:16-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch_test:
    image: elasticsearch:9.3.0
    container_name: todo-elastic-test
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      ENV_FILE: .env
    depends_on:
      postgres_test:
        condition: service_healthy
      elasticsearch_test:
        condition: service_healthy
    command: pytest -v