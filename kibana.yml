services:
  kibana:
    image: kibana:9.3.0
    container_name: kibana-cluster
    environment:
      - 'ELASTICSEARCH_HOSTS=["http://10.152.118.13:9200","http://10.152.118.11:9200","http://10.152.118.112:9200"]'
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: todo-db
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_8:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
    container_name: todo-app
    command: [ "/code/docker_scripts/app.sh" ]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./data:/code/data
      - ./scripts:/code/scripts
      - ./docker_scripts:/code/docker_scripts
      - ./images:/code/images
      - ./files:/code/files
      - ./migrations:/code/migrations
      - ./templates:/code/templates

volumes:
  postgres_data_8: